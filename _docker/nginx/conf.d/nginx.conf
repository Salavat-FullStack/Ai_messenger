server {
    listen 443 ssl;
    server_name chat-progress.ru;

    ssl_certificate /etc/letsencrypt/live/chat-progress.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat-progress.ru/privkey.pem;

    root /var/www/public;
    index index.html index.php;

    location / {
        if ($request_method = POST) {
            rewrite ^ /app/index.php last;
        }

        try_files $uri /index.html;
    }

    location ~ \.php$ {
        fastcgi_pass app_php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}