<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/AiStyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Pacifico&family=Roboto:ital,wght@0,100..900;1,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>Document</title>
</head>
<body>
    <div class="Ai_modal">
        <div class="Ai_nav">
            <div class="Ai_manager">
                <img src="image/icons/Ai_akuprof_logo.png" alt="manager" class="Ai_manager_logo">
                <div class="Ai_manager_name">akuprof.ru</div>
            </div>
            <div class="Ai_manager_call">
                <img src="image/icons/call_logo.png" alt="call" class="Ai_call_logo">
            </div>
        </div>
        <div class="Ai_message_storage">
            <div class="Ai_akuprof_message Ai_message">
                <div class="Ai_message_date">
                    <div class="message_user_name">akuprof.ru</div>
                    <div class="message_date">27 февр. 11:27</div>
                </div>
                <div class="Ai_message_value">Приветствуем Вас! Задавайте вопросы, а мы с радостью ответим и поможем Вам!</div>
            </div>
        </div>

        <div class="Ai_panel">
            <textarea id="Ai_request_input"></textarea>

            <div id="Ai_send_btn">
                <img src="image/icons/send_logo_2.png" alt="send">
            </div>
        </div>
    </div>


    <script src="js/index.js"></script>
</body>
</html>
